<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M X V D X N</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

/* Safe area for notched phones */
@supports (padding: env(safe-area-inset-bottom)) {
  body { padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  .global-footer { padding-bottom:calc(32px + env(safe-area-inset-bottom)); }
}

:root {
  --white:#ffffff;
  --dim:rgba(255,255,255,0.85); 
  --dim2:rgba(255,255,255,0.4);
  --dim3:rgba(255,255,255,0.12);
  --dim4:rgba(255,255,255,0.06);
  --black:#000000;
  --mono:'Courier New', Courier, monospace;
  --sans:'Helvetica Neue', Helvetica, Arial, sans-serif;
}

body {
  background:var(--black);
  color:var(--white);
  font-family:var(--sans); /* GLOBAL SANS SERIF */
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

img, video, iframe { max-width:100%; }

::selection { background:var(--white); color:var(--black); }

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
.label {
  font-family:var(--mono);
  font-size:14px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--dim2);
}

.heading-xl {
  font-family:var(--sans);
  font-weight:900;
  font-size:clamp(32px, 7vw, 80px);
  line-height:0.88;
  letter-spacing:-0.03em;
  text-transform:uppercase;
  color:var(--white);
}

.heading-lg {
  font-family:var(--sans);
  font-weight:900;
  font-size:clamp(24px, 4vw, 48px);
  line-height:0.92;
  letter-spacing:-0.02em;
  text-transform:uppercase;
  color:var(--white);
}

.heading-md {
  font-family:var(--sans);
  font-weight:800;
  font-size:clamp(18px, 2.5vw, 32px);
  line-height:1;
  letter-spacing:-0.01em;
  text-transform:uppercase;
  color:var(--white);
}

.body-text {
  font-family:var(--sans); 
  font-size:20px; 
  line-height:1.7;
  color:var(--dim);
}

.body-text strong { color:var(--white); font-weight:700; }

.rule { border:none; border-top:1px solid var(--dim3); }

/* ============================================================
   SCROLL REVEAL
   ============================================================ */
.reveal {
  opacity:0;
  transform:translateY(30px);
  transition:opacity 0.7s cubic-bezier(0.25,0.46,0.45,0.94),
             transform 0.7s cubic-bezier(0.25,0.46,0.45,0.94);
}
.reveal.vis { opacity:1; transform:none; }

/* ============================================================
   HERO / INDEX
   ============================================================ */
#video-bg {
  position:fixed; top:0; left:0; width:100%; height:100%;
  object-fit:cover; z-index:-2; opacity:0.4;
  transition:opacity 0.6s ease;
}

.hero-index {
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  grid-template-columns:minmax(0, 1fr) minmax(360px, 0.72fr);
  grid-template-rows:1fr auto;
  column-gap:5vw;
  padding:clamp(28px, 3vw, 48px) 5vw;
  max-width:1600px;
  margin:0 auto;
  width:100%;
}

.hero-identity {
  grid-column:1;
  grid-row:1;
  align-self:start;
  padding-top:5vh;
  position:relative;
  z-index:1;
}

.identity-meta {
  max-width:680px;
  margin-bottom:20px;
  font-family:var(--mono);
  font-size:clamp(11px, 0.95vw, 14px);
  line-height:1.4;
  letter-spacing:1.5px;
  color:var(--dim);
  text-transform:uppercase;
}

.identity-title {
  font-size:clamp(88px, 13.5vw, 205px);
  font-weight:900;
  line-height:0.74;
  letter-spacing:-0.045em;
  text-transform:uppercase;
  white-space:nowrap;
}

.hero-nav {
  grid-column:2;
  grid-row:1;
  align-self:start;
  margin-top:0;
}

.hero-col {
  display:flex;
  flex-direction:column;
  gap:3vh;
}

.hero-col-right {
  align-items:flex-end;
  text-align:right;
  width:100%;
}

.hero-group { display:flex; flex-direction:column; align-items:flex-start; }
.hero-col-right .hero-group { align-items:flex-end; }

.hero-meta {
  font-family:var(--mono);
  font-size:13px;
  color:var(--dim);
  letter-spacing:3.5px;
  margin-bottom:8px;
  text-transform:uppercase;
  transition:color 0.3s ease;
}

/* LINK HOVER EFFECT */
.hero-link {
  text-decoration:none;
  color:var(--white);
  font-size:clamp(46px, 9.5vh, 130px);
  font-weight:900;
  line-height:0.8;
  letter-spacing:-0.03em;
  text-transform:uppercase;
  transition:opacity 0.4s ease, transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
  display:inline-block;
  position: relative;
}

.hero-link::after {
  content: '';
  position: absolute;
  width: 100%;
  transform: scaleX(0);
  height: 2px;
  bottom: -4px;
  left: 0;
  background-color: var(--white);
  transform-origin: bottom right;
  transition: transform 0.4s cubic-bezier(0.86, 0, 0.07, 1);
}

.hero-group:hover .hero-link::after {
  transform: scaleX(1);
  transform-origin: bottom left;
}

.col-label {
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:3px;
  color:var(--dim);
  text-transform:uppercase;
  margin-bottom:20px;
  padding-bottom:10px;
  width:100%;
  text-align:right;
}

/* Hover group interactions */
.hero-col:hover .hero-group:not(:hover) .hero-link { opacity:0.25; }
.hero-col .hero-group:hover .hero-link { opacity:1; transform:translateX(15px); }
.hero-col-right .hero-group:hover .hero-link { transform:translateX(-15px); }
.hero-group:hover .hero-meta { color: var(--white); }

.hero-info {
  grid-column:1 / -1;
  grid-row:2;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  padding-top:24px;
  flex-wrap:wrap;
  gap:30px;
}

.hero-text {
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  color:var(--dim);
  text-transform:uppercase;
  max-width:450px;
}
.hero-text strong { color:var(--white); font-weight:700; }
.spacer { margin-bottom:12px; display:block; }
.hl { border-bottom:1px solid var(--white); color:var(--white); }

.hero-socials {
  margin-left:auto;
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-end;
  gap:clamp(16px, 2vw, 32px);
  flex-wrap:wrap;
  text-align:right;
}

.hero-social-link {
  color:var(--white);
  font-size:clamp(18px, 2.2vw, 36px);
  font-weight:800;
  line-height:1.05;
  letter-spacing:-0.02em;
  text-decoration:none;
  text-transform:uppercase;
}

.hero-social-link:hover,
.hero-social-link:focus-visible { text-decoration:underline; }

.partnerships {
  max-width:620px;
  font-family:var(--mono);
  font-size:10px;
  line-height:1.55;
  letter-spacing:1px;
  color:var(--dim2);
  text-transform:uppercase;
}

.partnerships strong {
  display:block;
  margin-bottom:5px;
  color:var(--white);
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:0;
}

/* ============================================================
   ABOUT ME SECTION
   ============================================================ */
.about-me {
  border-top:1px solid var(--dim3);
  padding:100px 5vw;
  max-width:1600px;
  margin:0 auto;
}

.about-me-grid {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}

.about-me-cell {
  padding:0 40px;
  border-right: 1px solid var(--dim3);
}

.about-me-cell:first-child { padding-left:0; }
.about-me-cell:last-child { border-right: none; padding-right:0; }

.about-me-name {
  font-family:var(--sans);
  font-weight:900;
  font-size:clamp(40px, 6vw, 72px);
  line-height:0.88;
  text-transform:uppercase;
  margin-bottom:12px;
}

.about-me-sub {
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:3px;
  color:var(--dim2);
  text-transform:uppercase;
  margin-bottom:32px;
  padding-bottom:32px;
  border-bottom:1px solid var(--dim3);
}

/* ============================================================
   PROJECT SECTIONS
   ============================================================ */
.project { position:relative; border-top:1px solid var(--dim3); }

.proj-hero {
  position:relative;
  height:85vh;
  min-height:500px;
  overflow:hidden;
}

.proj-hero video {
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
}

.proj-hero-overlay {
  position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,0.25) 0%, transparent 35%),
    linear-gradient(180deg, transparent 45%, rgba(0,0,0,0.92) 100%);
  z-index:1;
}

.proj-hero-content {
  position:absolute; bottom:0; left:0; right:0;
  z-index:2;
  padding:0 5vw 60px;
}

.proj-hero-num {
  font-family:var(--sans);
  font-weight:900;
  font-size:clamp(14px, 2vw, 22px);
  letter-spacing:6px;
  color:var(--white);
  text-transform:uppercase;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:20px;
}

.proj-hero-num::after {
  content:'';
  height:1px;
  width:60px;
  background:rgba(255,255,255,0.3);
}

.proj-hero-title {
  font-family:var(--sans);
  font-weight:900;
  font-size:clamp(48px, 12vw, 160px);
  line-height:0.85;
  letter-spacing:-0.04em;
  text-transform:uppercase;
  color:var(--white);
  margin-bottom:16px;
}

.proj-hero-sub {
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:3px;
  color:var(--dim);
  text-transform:uppercase;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}

.proj-hero-sub .dot { width:4px; height:4px; border-radius:50%; background:var(--dim); flex-shrink:0; }

.proj-content { padding:0 5vw; max-width:1600px; margin:0 auto; }

.editorial {
  display:grid;
  grid-template-columns:280px 1fr;
  gap:0;
  border-bottom:1px solid var(--dim3);
}

.editorial-label { padding:60px 40px 60px 0; border-right:1px solid var(--dim3); }
.editorial-body { padding:60px 0 60px 40px; }
.editorial-body .body-text { max-width:850px; }
.editorial-body .body-text p { margin-bottom:32px; }

/* EPISODES GRID */
.ep-section { padding:60px 0; border-bottom:1px solid var(--dim3); }
.ep-section-header {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:40px;
  padding-bottom:20px;
  border-bottom:1px solid var(--dim3);
}

.ep-count { font-family:var(--mono); font-size:12px; letter-spacing:2px; color:var(--dim2); text-transform:uppercase; }

.ep-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
  gap:20px;
}

.ep-card {
  background:rgba(255,255,255,0.03);
  border:1px solid var(--dim3);
  overflow:hidden;
  transition:transform 0.35s cubic-bezier(0.23, 1, 0.32, 1);
}
.ep-card:hover { transform:translateY(-5px); }

.ep-thumb { position:relative; width:100%; padding-bottom:56.25%; background:#000; overflow:hidden; }
.ep-thumb iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }

.ep-info { padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
.ep-num { font-family:var(--sans); font-weight:800; font-size:14px; text-transform:uppercase; }
.ep-tag { font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--dim2); border:1px solid var(--dim3); padding:3px 8px; }

/* FOOTER */
.global-footer { padding:40px 5vw; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px; }
.global-footer span { font-family:var(--mono); font-size:11px; letter-spacing:3px; color:var(--dim2); text-transform:uppercase; }

/* RESPONSIVE */
@media (max-width:1024px) {
  .hero-index {
    grid-template-columns:minmax(0, 1fr) minmax(320px, 0.75fr);
    padding:24px 5vw;
  }
  .hero-identity { padding-top:3vh; }
  .identity-title { font-size:clamp(85px, 13vw, 155px); }
  .hero-link { font-size:clamp(52px, 9.5vw, 96px); }
  .editorial { grid-template-columns:1fr; }
  .editorial-label { padding:48px 0 0; border-right:none; }
  .editorial-body { padding:20px 0 48px 0; }
  .about-me-grid { grid-template-columns: 1fr; }
  .about-me-cell { border-right:none; border-bottom: 1px solid var(--dim3); padding:0 0 40px 0; margin-bottom:40px; }
}

@media (max-width:640px) {
  .hero-index {
    min-height:100svh;
    display:flex;
    flex-direction:column;
    padding:20px;
  }
  .hero-identity { padding-top:0; }
  .identity-meta { max-width:330px; margin-bottom:12px; font-size:10px; }
  .identity-title { font-size:clamp(72px, 21vw, 100px); }
  .hero-nav { align-self:stretch; width:100%; margin-top:48px; }
  .hero-col-right { width:100%; gap:28px; }
  .hero-link { font-size:clamp(40px, 13vw, 60px); }
  .hero-info {
    margin-top:auto;
    padding-top:48px;
    align-items:flex-start;
    gap:24px;
  }
  .hero-socials {
    order:1;
    width:100%;
    margin-left:0;
    justify-content:flex-start;
    gap:10px 20px;
    text-align:left;
  }
  .hero-social-link { font-size:19px; }
  .partnerships { order:2; max-width:350px; font-size:8px; }
}
</style>
</head>

<script>
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('vis'); });
}, { threshold: 0.06 });
document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

const videoBg = document.getElementById('video-bg');
const heroIdx = document.querySelector('.hero-index');
function checkBg() {
  const b = heroIdx.getBoundingClientRect().bottom;
  videoBg.style.opacity = b > 0 ? '0.4' : '0';
}
window.addEventListener('scroll', checkBg, { passive:true });
</script>
